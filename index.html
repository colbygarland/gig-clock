<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Gig Clock" />
    <title>Gig Clock</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preload" href="fonts/DSEG7Classic-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "DSEG7 Classic";
        src: url("fonts/DSEG7Classic-Bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        height: 100%;
        background: #000;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      body {
        display: flex;
        height: 100dvh;
      }

      main {
        flex: 1;
        min-width: 0;
        container-type: size;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6vh;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      #time {
        font-family: "DSEG7 Classic", ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.02em;
        white-space: nowrap;
        font-size: min(27cqw, 55cqh);
        opacity: var(--digit-brightness, 1);
      }

      #time.long {
        font-size: min(21cqw, 45cqh);
      }

      .brightness {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 4vh;
        padding: 0 max(12px, env(safe-area-inset-right)) 0 0;
      }

      .brightness button {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        font-size: 32px;
        line-height: 1;
        color: #888;
        background: #1a1a1a;
      }

      .brightness button:disabled {
        opacity: 0.35;
        cursor: default;
      }

      #time.ended {
        color: #777;
      }

      button {
        font: inherit;
        font-weight: 700;
        color: #000;
        background: #fff;
        border: 0;
        border-radius: 24px;
        cursor: pointer;
      }

      #start {
        width: min(88cqw, 700px);
        height: min(40cqh, 320px);
        font-size: min(14cqw, 12cqh);
      }

      #end {
        position: relative;
        overflow: hidden;
        width: min(75cqw, 500px);
        padding: 3vh 0;
        font-size: min(6.5cqw, 5cqh);
        color: #fff;
        background: #222;
      }

      #end .fill {
        position: absolute;
        inset: 0;
        background: #b00;
        transform: scaleX(0);
        transform-origin: left;
      }

      #end.holding .fill {
        transform: scaleX(1);
        transition: transform var(--hold-ms) linear;
      }

      #end .label {
        position: relative;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="time" hidden>0:00</div>
      <button id="start" type="button">Start Set</button>
      <button id="end" type="button" hidden>
        <span class="fill"></span>
        <span class="label">Hold to End Set</span>
      </button>
    </main>
    <aside class="brightness">
      <button id="brighter" type="button" aria-label="Brighter numbers">+</button>
      <button id="dimmer" type="button" aria-label="Dimmer numbers">−</button>
    </aside>

    <script type="module">
      import { BRIGHTNESS_LEVELS, formatElapsed, msUntilNextTick, stepBrightness } from "./clock.js";

      const BRIGHTNESS_KEY = "gig-clock:brightness";
      const brighterBtn = document.getElementById("brighter");
      const dimmerBtn = document.getElementById("dimmer");

      let brightnessIndex = (() => {
        try {
          const raw = localStorage.getItem(BRIGHTNESS_KEY);
          return stepBrightness(raw === null ? NaN : Number(raw), 0);
        } catch {
          return stepBrightness(NaN, 0);
        }
      })();

      function applyBrightness() {
        document.documentElement.style.setProperty(
          "--digit-brightness",
          String(BRIGHTNESS_LEVELS[brightnessIndex]),
        );
        brighterBtn.disabled = brightnessIndex === BRIGHTNESS_LEVELS.length - 1;
        dimmerBtn.disabled = brightnessIndex === 0;
        try {
          localStorage.setItem(BRIGHTNESS_KEY, String(brightnessIndex));
        } catch {}
      }

      brighterBtn.addEventListener("click", () => {
        brightnessIndex = stepBrightness(brightnessIndex, 1);
        applyBrightness();
      });
      dimmerBtn.addEventListener("click", () => {
        brightnessIndex = stepBrightness(brightnessIndex, -1);
        applyBrightness();
      });
      applyBrightness();

      const STORAGE_KEY = "gig-clock:startedAt";
      const HOLD_MS = 1500;

      const timeEl = document.getElementById("time");
      const startBtn = document.getElementById("start");
      const endBtn = document.getElementById("end");
      endBtn.style.setProperty("--hold-ms", `${HOLD_MS}ms`);

      let startedAt = null;
      let tickTimer = null;
      let wakeLock = null;

      function readSaved() {
        try {
          const value = Number(localStorage.getItem(STORAGE_KEY));
          return value > 0 ? value : null;
        } catch {
          return null;
        }
      }

      function save(value) {
        try {
          if (value === null) {
            localStorage.removeItem(STORAGE_KEY);
          } else {
            localStorage.setItem(STORAGE_KEY, String(value));
          }
        } catch {}
      }

      async function keepScreenOn() {
        try {
          if ("wakeLock" in navigator && startedAt !== null && !wakeLock) {
            wakeLock = await navigator.wakeLock.request("screen");
            wakeLock.addEventListener("release", () => (wakeLock = null));
          }
        } catch {}
      }

      function letScreenSleep() {
        wakeLock?.release().catch(() => {});
        wakeLock = null;
      }

      function render(elapsed) {
        const text = formatElapsed(elapsed);
        timeEl.textContent = text;
        timeEl.classList.toggle("long", text.length > 5);
      }

      function tick() {
        const elapsed = Date.now() - startedAt;
        render(elapsed);
        tickTimer = setTimeout(tick, msUntilNextTick(elapsed));
      }

      function startSet(at = Date.now()) {
        startedAt = at;
        save(at);
        timeEl.classList.remove("ended");
        timeEl.hidden = false;
        startBtn.hidden = true;
        endBtn.hidden = false;
        clearTimeout(tickTimer);
        tick();
        keepScreenOn();
      }

      function endSet() {
        clearTimeout(tickTimer);
        render(Date.now() - startedAt);
        startedAt = null;
        save(null);
        letScreenSleep();
        timeEl.classList.add("ended");
        endBtn.hidden = true;
        startBtn.hidden = false;
      }

      function goFullScreen() {
        const root = document.documentElement;
        const request = root.requestFullscreen ?? root.webkitRequestFullscreen;
        if (!request || document.fullscreenElement || document.webkitFullscreenElement) {
          return;
        }
        try {
          Promise.resolve(request.call(root, { navigationUI: "hide" })).catch(() => {});
        } catch {}
      }

      startBtn.addEventListener("click", () => {
        goFullScreen();
        startSet();
      });

      let holdTimer = null;

      function cancelHold() {
        clearTimeout(holdTimer);
        endBtn.classList.remove("holding");
      }

      endBtn.addEventListener("pointerdown", (event) => {
        endBtn.setPointerCapture(event.pointerId);
        endBtn.classList.add("holding");
        holdTimer = setTimeout(() => {
          cancelHold();
          endSet();
        }, HOLD_MS);
      });
      endBtn.addEventListener("pointerup", cancelHold);
      endBtn.addEventListener("pointercancel", cancelHold);
      endBtn.addEventListener("contextmenu", (event) => event.preventDefault());

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && startedAt !== null) {
          clearTimeout(tickTimer);
          tick();
          keepScreenOn();
        }
      });

      const saved = readSaved();
      if (saved !== null) {
        startSet(saved);
      }
    </script>
  </body>
</html>
